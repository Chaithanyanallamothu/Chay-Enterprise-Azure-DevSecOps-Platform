apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Chay DevSecOps Platform
        orgId: 1
        folder: Chay DevSecOps
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
