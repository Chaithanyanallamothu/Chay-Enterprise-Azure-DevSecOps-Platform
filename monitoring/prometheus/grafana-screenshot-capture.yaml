apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-screenshot-capture
  namespace: monitoring
  labels:
    app: grafana-screenshot-capture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-screenshot-capture
  template:
    metadata:
      labels:
        app: grafana-screenshot-capture
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capture
          image: browserless/chrome:1.61-chrome-stable
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              URL="http://grafana.monitoring.svc.cluster.local:3000/d/chay-demo-api/chay-demo-api-runtime-observability?orgId=1&kiosk"

              echo "=== GRAFANA SCREENSHOT CAPTURE ==="
              echo "Waiting for Grafana..."
              sleep 10

              CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"

              "$CHROME_BIN" \
                --headless \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-gpu \
                --hide-scrollbars \
                --window-size=1920,1400 \
                --virtual-time-budget=15000 \
                --screenshot=/tmp/grafana-runtime-dashboard.png \
                "$URL"

              test -s /tmp/grafana-runtime-dashboard.png

              echo "GRAFANA SCREENSHOT: CAPTURED"
              echo "GRAFANA_PNG_BASE64_BEGIN"
              base64 /tmp/grafana-runtime-dashboard.png
              echo "GRAFANA_PNG_BASE64_END"
              echo "GRAFANA SCREENSHOT CAPTURE: PASSED"

              while true; do
                sleep 3600
              done
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
