apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-baseline-test
  namespace: monitoring
data:
  baseline.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    
    export const options = {
      scenarios: {
        baseline_load: {
          executor: 'constant-vus',
          vus: 5,
          duration: '60s',
        },
      },
      thresholds: {
        http_req_failed: ['rate<0.01'],
        http_req_duration: ['p(95)<1000'],
        checks: ['rate>0.99'],
      },
    };
    
    const BASE_URL =
      __ENV.BASE_URL ||
      'http://chay-demo-api.chay-devsecops.svc.cluster.local';
    
    export default function () {
      const health = http.get(`${BASE_URL}/health`);
    
      check(health, {
        'health returns 200': (r) => r.status === 200,
      });
    
      const orders = http.get(`${BASE_URL}/api/orders`);
    
      check(orders, {
        'orders returns 200': (r) => r.status === 200,
      });
    
      sleep(0.5);
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-baseline
  namespace: monitoring
  labels:
    app: k6-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-baseline
  template:
    metadata:
      labels:
        app: k6-baseline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "=== k6 Private AKS Baseline Load Test ==="

              k6 run /scripts/baseline.js

              RESULT=$?

              echo
              echo "=== k6 Baseline Test Exit Code: ${RESULT} ==="

              if [ "$RESULT" -eq 0 ]; then
                echo "K6 BASELINE LOAD TEST: PASSED"
              else
                echo "K6 BASELINE LOAD TEST: FAILED"
              fi

              while true; do
                sleep 3600
              done
          env:
            - name: BASE_URL
              value: http://chay-demo-api.chay-devsecops.svc.cluster.local
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-script
          configMap:
            name: k6-baseline-test
