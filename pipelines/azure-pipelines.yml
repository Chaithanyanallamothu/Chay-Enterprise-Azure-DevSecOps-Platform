# Chay Enterprise Azure DevSecOps Platform
# Author: Chaithanya Nallamothu
# Role: Senior DevSecOps Engineer
#
# CI responsibilities:
#   - Application validation
#   - SonarQube Cloud analysis
#   - Source and dependency security validation
#   - Production container build
#   - Container vulnerability gate
#   - Immutable artifact publication to private Azure Container Registry
#
# CI builds and publishes artifacts only.
# Argo CD will own deployment through GitOps.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.12'
  applicationPath: 'application'

  # Security tooling is version-pinned so scanner behavior remains deterministic.
  trivyVersion: 'v0.74.0'

  # Azure artifact configuration.
  acrName: 'chaysecureapiprodacr'
  acrLoginServer: 'chaysecureapiprodacr.azurecr.io'
  acrRepository: 'chay-enterprise-devsecops/demo-api'
  imageTag: '$(Build.SourceVersion)'

stages:

  # ---------------------------------------------------------------------------
  # Stage 1 - Application quality validation
  # ---------------------------------------------------------------------------
  - stage: Validate
    displayName: Application Validation

    jobs:
      - job: QualityChecks
        displayName: Lint, Test, Coverage and SonarQube

        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: '$(pythonVersion)'

          # Sonar configuration is version-controlled in
          # sonar-project.properties.
          - task: SonarCloudPrepare@4
            displayName: Prepare SonarQube Cloud analysis
            inputs:
              SonarQube: 'chay-sonarqube-cloud'
              organization: 'chaithanyanallamothu'
              scannerMode: 'cli'
              configMode: 'file'

          - script: |
              set -euo pipefail

              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            workingDirectory: $(applicationPath)
            displayName: Install application dependencies

          - script: |
              set -euo pipefail

              ruff check src tests
            workingDirectory: $(applicationPath)
            displayName: Run Ruff static analysis

          - script: |
              set -euo pipefail

              pytest tests \
                --junitxml=test-results.xml \
                --cov=src \
                --cov-report=term-missing \
                --cov-report=xml:coverage.xml
            workingDirectory: $(applicationPath)
            displayName: Run unit tests and coverage

          - task: PublishTestResults@2
            displayName: Publish unit test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(applicationPath)/test-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Chay Demo API - Unit Tests'

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/$(applicationPath)/coverage.xml'

          - task: SonarCloudAnalyze@4
            displayName: Run SonarQube Cloud analysis
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          - task: SonarCloudPublish@4
            displayName: Publish SonarQube Quality Gate
            inputs:
              pollingTimeoutSec: '300'

  # ---------------------------------------------------------------------------
  # Stage 2 - Source security validation
  # ---------------------------------------------------------------------------
  - stage: Security
    displayName: Security Validation
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - job: SourceSecurityChecks
        displayName: Secret and Dependency Security

        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail

              curl -sfL \
                https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sudo sh -s -- -b /usr/local/bin "$(trivyVersion)"

              trivy --version
            displayName: Install pinned Trivy $(trivyVersion)

          # Credentials and private material must never enter source control.
          - script: |
              set -euo pipefail

              echo "Running repository secret scan..."

              trivy fs \
                --scanners secret \
                --exit-code 1 \
                --no-progress \
                .

              echo "Secret scanning gate passed."
            displayName: Secret scanning gate

          # Fixable HIGH and CRITICAL dependency vulnerabilities block
          # progression to artifact creation.
          - script: |
              set -euo pipefail

              echo "Scanning application dependencies..."

              trivy fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                "$(applicationPath)"

              echo "Dependency vulnerability gate passed."
            displayName: Dependency vulnerability gate

  # ---------------------------------------------------------------------------
  # Stage 3 - Build, scan and publish the production artifact
  #
  # This stage runs inside the private Azure network because ACR has public
  # network access disabled. The agent VM uses its system-assigned managed
  # identity; no registry username/password is stored in the pipeline.
  # ---------------------------------------------------------------------------
  - stage: Artifact
    displayName: Build, Scan and Publish Artifact
    dependsOn: Security
    condition: succeeded()

    jobs:
      - job: BuildScanPublish
        displayName: Build, Scan and Publish to Private ACR

        pool:
          name: Private-Azure-Agent-Pool
          demands:
            - Agent.Name -equals chay-secure-api-prod-agent-01
            - docker

        steps:
          - checkout: self
            clean: true

          # Validate the tools and identity context on the private agent before
          # touching the registry.
          - script: |
              set -euo pipefail

              echo "Agent:"
              echo "  Name: $(Agent.Name)"
              echo "  OS:   $(Agent.OS)"
              echo

              command -v docker
              docker --version

              if ! command -v az >/dev/null 2>&1; then
                echo "ERROR: Azure CLI is not installed on the private agent."
                exit 1
              fi

              az version --query '"azure-cli"' -o tsv

              echo
              echo "Private agent prerequisites passed."
            displayName: Validate private agent prerequisites

          # Authenticate with the VM's system-assigned managed identity.
          # No service-principal secret or ACR admin credential is required.
          - script: |
              set -euo pipefail

              az login --identity --output none
              az account set \
                --subscription "c514ee69-6634-4342-8a48-9c00338e71aa"

              echo "Authenticated Azure identity:"
              az account show \
                --query "{Subscription:name,Tenant:tenantId}" \
                -o table

              echo
              echo "Authenticating Docker to private ACR..."

              az acr login \
                --name "$(acrName)"

              echo "Private ACR authentication passed."
            displayName: Authenticate to Azure and private ACR

          # Install the same pinned Trivy release used by the source-security
          # stage. Installation is skipped if that exact version already exists.
          - script: |
              set -euo pipefail

              EXPECTED_VERSION="${TRIVY_VERSION#v}"
              CURRENT_VERSION=""

              if command -v trivy >/dev/null 2>&1; then
                CURRENT_VERSION="$(trivy --version | awk '/^Version:/ {print $2; exit}')"
              fi

              if [ "${CURRENT_VERSION}" != "${EXPECTED_VERSION}" ]; then
                echo "Installing Trivy ${TRIVY_VERSION}..."

                curl -sfL \
                  https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                  | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
              fi

              trivy --version
            displayName: Prepare pinned Trivy on private agent
            env:
              TRIVY_VERSION: $(trivyVersion)

          # Build the production candidate once on the private x64 agent.
          # The Git SHA provides an immutable source-to-artifact identity.
          - script: |
              set -euo pipefail

              IMAGE="$(acrLoginServer)/$(acrRepository):$(imageTag)"

              echo "Building production artifact:"
              echo "${IMAGE}"

              docker build \
                --pull \
                --platform linux/amd64 \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --label "org.opencontainers.image.source=$(Build.Repository.Uri)" \
                --tag "${IMAGE}" \
                "$(applicationPath)"

              echo
              echo "Built image metadata:"

              docker image inspect "${IMAGE}" \
                --format='Image={{join .RepoTags ","}} Architecture={{.Architecture}} User={{.Config.User}} Id={{.Id}}'
            displayName: Build immutable production container

          # Scan the exact image that will be pushed. A fixable HIGH or
          # CRITICAL finding stops publication.
          - script: |
              set -euo pipefail

              IMAGE="$(acrLoginServer)/$(acrRepository):$(imageTag)"

              echo "Scanning production artifact:"
              echo "${IMAGE}"

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                "${IMAGE}"

              echo
              echo "Container security gate passed."
              echo "No fixable HIGH or CRITICAL vulnerabilities detected."
            displayName: Production container vulnerability gate

          # Push the exact image that passed the vulnerability gate.
          - script: |
              set -euo pipefail

              IMAGE="$(acrLoginServer)/$(acrRepository):$(imageTag)"

              echo "Publishing security-approved artifact:"
              echo "${IMAGE}"

              docker push "${IMAGE}"

              echo
              echo "Artifact push completed."
            displayName: Publish immutable image to private ACR

          # Resolve the registry digest after publication. This gives us the
          # immutable Git SHA -> image tag -> OCI digest traceability chain that
          # GitOps will consume later.
          - script: |
              set -euo pipefail

              IMAGE="$(acrLoginServer)/$(acrRepository):$(imageTag)"

              echo "Verifying published artifact:"
              echo "${IMAGE}"

              DIGEST="$(az acr repository show \
                --name "$(acrName)" \
                --image "$(acrRepository):$(imageTag)" \
                --query digest \
                --output tsv)"

              if [ -z "${DIGEST}" ]; then
                echo "ERROR: ACR did not return an image digest."
                exit 1
              fi

              echo
              echo "Git commit : $(Build.SourceVersion)"
              echo "Image      : ${IMAGE}"
              echo "Digest     : ${DIGEST}"
              echo
              echo "Immutable artifact publication verified."

              echo "##vso[task.setvariable variable=publishedImageDigest;isOutput=true]${DIGEST}"
            name: VerifyArtifact
            displayName: Verify ACR artifact and capture digest

          # Remove local credentials and image data from the persistent
          # self-hosted agent after the job.
          - script: |
              set +e

              IMAGE="$(acrLoginServer)/$(acrRepository):$(imageTag)"

              docker logout "$(acrLoginServer)" >/dev/null 2>&1
              docker image rm "${IMAGE}" >/dev/null 2>&1

              az logout >/dev/null 2>&1

              echo "Private agent cleanup completed."
            displayName: Clean private agent workspace
            condition: always()
