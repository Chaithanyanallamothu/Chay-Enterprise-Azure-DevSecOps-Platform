# Author: Chaithanya Nallamothu
# Role: Senior DevSecOps Engineer
#
# One-time evidence workflow.
# Retrieves the Grafana screenshot generated inside private AKS and
# publishes the PNG as an Azure DevOps pipeline artifact.

trigger: none
pr: none

pool:
  name: Private-Azure-Agent-Pool
  demands:
    - Agent.Name -equals chay-secure-api-prod-agent-01

variables:
  azureSubscriptionId: 'c514ee69-6634-4342-8a48-9c00338e71aa'
  aksResourceGroup: 'chay-secure-api-prod-rg'
  aksClusterName: 'chay-secure-api-prod-aks'

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      cleanup() {
        az logout >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      echo "=== PRIVATE GRAFANA EVIDENCE RETRIEVAL ==="

      az login --identity --output none
      az account set --subscription "$(azureSubscriptionId)"

      az aks get-credentials \
        --resource-group "$(aksResourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      kubelogin convert-kubeconfig -l azurecli

      echo
      echo "Waiting for screenshot capture workload..."

      for attempt in $(seq 1 30); do
        LOGS="$(kubectl logs \
          -n monitoring \
          deployment/grafana-screenshot-capture \
          2>/dev/null || true)"

        if printf '%s\n' "$LOGS" | grep -q \
          "GRAFANA SCREENSHOT CAPTURE: PASSED"; then
          echo "Screenshot capture completed."
          break
        fi

        if [ "$attempt" -eq 30 ]; then
          echo "ERROR: Screenshot capture did not complete."
          kubectl get pods \
            -n monitoring \
            -l app=grafana-screenshot-capture \
            -o wide || true
          exit 1
        fi

        sleep 5
      done

      mkdir -p "$(Build.ArtifactStagingDirectory)/grafana"

      printf '%s\n' "$LOGS" > "$(Agent.TempDirectory)/grafana-capture.log"

      python3 - <<'PY'
      from pathlib import Path
      import base64
      import re
      import os

      log = Path(os.environ["AGENT_TEMPDIRECTORY"]) / "grafana-capture.log"
      output = (
          Path(os.environ["BUILD_ARTIFACTSTAGINGDIRECTORY"])
          / "grafana"
          / "07-grafana-runtime-dashboard.png"
      )

      text = log.read_text(errors="replace")

      end_marker = "GRAFANA_PNG_BASE64_END"

      if end_marker not in text:
          raise SystemExit("ERROR: Screenshot end marker not found.")

      before_end = text.rsplit(end_marker, 1)[0]

      # Locate the PNG Base64 signature produced by the capture container.
      start = before_end.rfind("iVBORw0KGgo")

      if start == -1:
          raise SystemExit("ERROR: PNG Base64 signature not found.")

      block = before_end[start:]

      payload = "".join(
          line.strip()
          for line in block.splitlines()
          if re.fullmatch(r"[A-Za-z0-9+/=]+", line.strip())
      )

      payload += "=" * (-len(payload) % 4)

      image = base64.b64decode(payload, validate=True)

      if not image.startswith(b"\x89PNG\r\n\x1a\n"):
          raise SystemExit("ERROR: Decoded artifact is not a PNG.")

      output.write_bytes(image)

      print(f"PNG artifact: {output}")
      print(f"PNG bytes: {len(image):,}")
      print("PNG validation: PASSED")
      PY

      file \
        "$(Build.ArtifactStagingDirectory)/grafana/07-grafana-runtime-dashboard.png"

      echo
      echo "GRAFANA EVIDENCE RETRIEVAL: PASSED"

    displayName: 'Retrieve Grafana screenshot from private AKS'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Grafana dashboard evidence'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/grafana'
      artifact: 'grafana-dashboard-evidence'
      publishLocation: 'pipeline'
