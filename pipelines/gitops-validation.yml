# Author: Chaithanya Nallamothu
# Role: Senior DevSecOps Engineer
#
# Read-only validation of the GitOps-managed workload after Argo CD reconciliation.

trigger: none
pr: none

pool:
  name: Private-Azure-Agent-Pool
  demands:
    - Agent.Name -equals chay-secure-api-prod-agent-01

variables:
  azureSubscriptionId: 'c514ee69-6634-4342-8a48-9c00338e71aa'
  aksResourceGroup: 'chay-secure-api-prod-rg'
  aksClusterName: 'chay-secure-api-prod-aks'
  applicationName: 'chay-demo-api'
  applicationNamespace: 'chay-devsecops'

steps:
  - checkout: self
    clean: true

  - bash: |
      set -euo pipefail

      echo "=== Authenticate With Azure Managed Identity ==="
      az login --identity --output none
      az account set --subscription "$(azureSubscriptionId)"

      echo
      echo "=== Connect To Private AKS ==="
      az aks get-credentials \
        --resource-group "$(aksResourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      echo
      echo "=== Private ACR Artifact Verification ==="

      IMAGE_TAG=$(awk '/^[[:space:]]*tag:/ {gsub(/"/, "", $2); print $2; exit}' helm/chay-demo-api/values.yaml)
      REPOSITORY="chay-enterprise-devsecops/demo-api"

      echo "Repository: ${REPOSITORY}"
      echo "Tag: ${IMAGE_TAG}"

      az acr repository show         --name chaysecureapiprodacr         --image "${REPOSITORY}:${IMAGE_TAG}"         --query "{Digest:digest,Created:createdTime,LastUpdate:lastUpdateTime}"         -o table

      echo
      echo "=== GitOps Runtime State ==="
      echo "Argo CD reconciliation was validated during controlled bootstrap."
      echo "This least-privilege validation verifies deployed workload state directly."

      kubectl get deployment chay-demo-api -n chay-devsecops
      kubectl get pods -n chay-devsecops
      kubectl get service chay-demo-api -n chay-devsecops

      echo
      echo "=== Kubernetes Workload ==="
      kubectl get deployment,pods,service \
        -n "$(applicationNamespace)" \
        -o wide

      echo
      echo "=== Deployment Resource Configuration ==="
      kubectl get deployment "$(applicationName)" \
        -n "$(applicationNamespace)" \
        -o jsonpath='CPU Request: {.spec.template.spec.containers[0].resources.requests.cpu}{"\n"}Memory Request: {.spec.template.spec.containers[0].resources.requests.memory}{"\n"}CPU Limit: {.spec.template.spec.containers[0].resources.limits.cpu}{"\n"}Memory Limit: {.spec.template.spec.containers[0].resources.limits.memory}{"\n"}Image: {.spec.template.spec.containers[0].image}{"\n"}'

      echo
      echo
      echo "=== Current Cluster Capacity ==="
      kubectl top nodes || true

      echo
      echo "=== Current Pod CPU Requests ==="
      kubectl get pods -A         -o custom-columns='NAMESPACE:.metadata.namespace,POD:.metadata.name,CPU_REQUEST:.spec.containers[*].resources.requests.cpu,MEMORY_REQUEST:.spec.containers[*].resources.requests.memory'         --sort-by=.metadata.namespace || true

      echo
      echo "=== Node Allocated Resources ==="
      kubectl describe node | sed -n '/Allocated resources:/,/Events:/p' || true

      echo
      echo "=== Rollout Validation ==="
      if ! kubectl rollout status deployment/"$(applicationName)" \
        -n "$(applicationNamespace)" \
        --timeout=120s; then

        echo
        echo "=== Rollout Failure Diagnostics ==="

        kubectl get pods           -n "$(applicationNamespace)"           -o wide || true

        echo
        echo "=== Pod Events ==="

        kubectl describe pods           -n "$(applicationNamespace)" || true

        echo
        echo "=== Namespace Events ==="

        kubectl get events           -n "$(applicationNamespace)"           --sort-by='.lastTimestamp' || true

        exit 1
      fi

      echo
      echo "=== Application Runtime Validation ==="

      echo
      echo "Application deployment:"
      kubectl get deployment "$(applicationName)"         -n "$(applicationNamespace)"         -o wide

      echo
      echo "Application pods:"
      kubectl get pods         -n "$(applicationNamespace)"         -l app.kubernetes.io/name="$(applicationName)"         -o wide ||       kubectl get pods -n "$(applicationNamespace)" -o wide

      echo
      echo "Application service:"
      kubectl get service "$(applicationName)"         -n "$(applicationNamespace)"

      echo
      echo "Application endpoints:"
      kubectl get endpoints "$(applicationName)"         -n "$(applicationNamespace)"

      echo
      echo "Application rollout:"
      kubectl rollout status deployment/"$(applicationName)"         -n "$(applicationNamespace)"         --timeout=180s

      echo
      echo "=== Monitoring Runtime Validation ==="

      echo
      echo "Monitoring deployments:"
      kubectl get deployment -n monitoring

      echo
      echo "Monitoring pods:"
      kubectl get pods -n monitoring -o wide

      echo
      echo "Monitoring services:"
      kubectl get service -n monitoring

      echo
      echo "Monitoring endpoints:"
      kubectl get endpoints -n monitoring

      echo
      echo "=== Prometheus Rollout ==="

      kubectl rollout status deployment/prometheus         -n monitoring         --timeout=180s

      echo
      echo "=== Grafana Rollout ==="

      kubectl rollout status deployment/grafana         -n monitoring         --timeout=180s

      echo
      echo "=== In-Cluster Monitoring Validation ==="

      echo "Waiting for monitoring-validator deployment..."

      kubectl rollout status deployment/monitoring-validator         -n monitoring         --timeout=180s

      echo
      echo "Monitoring validator pod:"
      kubectl get pods         -n monitoring         -l app=monitoring-validator         -o wide

      echo
      echo "=== Monitoring Validator Results ==="

      VALIDATOR_LOGS=$(kubectl logs         -n monitoring         deployment/monitoring-validator)

      echo "$VALIDATOR_LOGS"

      echo "$VALIDATOR_LOGS" | grep -q         "MONITORING VALIDATION: PASSED" || {
          echo "ERROR: Monitoring validator did not report PASSED."
          exit 1
        }

      echo "$VALIDATOR_LOGS" | grep -q         "Prometheus scrape target: UP" || {
          echo "ERROR: Prometheus scrape validation was not successful."
          exit 1
        }

      echo "$VALIDATOR_LOGS" | grep -q         "Grafana dashboard provisioning: PASS" || {
          echo "ERROR: Grafana dashboard validation was not successful."
          exit 1
        }

      echo
      echo "In-cluster monitoring validation: PASSED"

      echo
      echo "=== k6 Baseline Load Test Validation ==="

      echo "Waiting for k6 baseline workload..."
      kubectl rollout status deployment/k6-baseline         -n monitoring         --timeout=180s

      echo
      echo "k6 baseline pod:"
      kubectl get pods         -n monitoring         -l app=k6-baseline         -o wide

      echo
      echo "=== k6 Baseline Results ==="

      K6_LOGS=$(kubectl logs         -n monitoring         deployment/k6-baseline)

      echo "$K6_LOGS"

      echo "$K6_LOGS" | grep -q         "K6 BASELINE LOAD TEST: PASSED" || {
          echo "ERROR: k6 baseline load test did not report PASSED."
          exit 1
        }

      echo
      echo "k6 private AKS baseline validation: PASSED"

      echo
      echo "=== HPA and Metrics Validation ==="

      echo "Horizontal Pod Autoscaler:"
      kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o wide

      HPA_MIN=$(kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o jsonpath='{.spec.minReplicas}')

      HPA_MAX=$(kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o jsonpath='{.spec.maxReplicas}')

      HPA_TARGET=$(kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o jsonpath='{.spec.metrics[0].resource.target.averageUtilization}')

      HPA_CURRENT=$(kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o jsonpath='{.status.currentReplicas}')

      HPA_DESIRED=$(kubectl get hpa chay-demo-api         -n "$(applicationNamespace)"         -o jsonpath='{.status.desiredReplicas}')

      echo
      echo "HPA min replicas: ${HPA_MIN}"
      echo "HPA max replicas: ${HPA_MAX}"
      echo "HPA CPU target: ${HPA_TARGET}%"
      echo "HPA current replicas: ${HPA_CURRENT}"
      echo "HPA desired replicas: ${HPA_DESIRED}"

      if [ "$HPA_MIN" != "1" ] ||          [ "$HPA_MAX" != "3" ] ||          [ "$HPA_TARGET" != "50" ]; then
        echo "ERROR: Live HPA configuration does not match GitOps desired state."
        exit 1
      fi

      echo
      echo "Application pod CPU metrics:"
      kubectl top pods         -n "$(applicationNamespace)"         -l app.kubernetes.io/name=chay-demo-api

      echo
      echo "HPA and metrics-server validation: PASSED"

      echo
      echo "=== Runtime Readiness Summary ==="

      APP_AVAILABLE=$(kubectl get deployment "$(applicationName)"         -n "$(applicationNamespace)"         -o jsonpath='{.status.availableReplicas}')

      PROM_AVAILABLE=$(kubectl get deployment prometheus         -n monitoring         -o jsonpath='{.status.availableReplicas}')

      GRAFANA_AVAILABLE=$(kubectl get deployment grafana         -n monitoring         -o jsonpath='{.status.availableReplicas}')

      echo "Application available replicas: ${APP_AVAILABLE:-0}"
      echo "Prometheus available replicas: ${PROM_AVAILABLE:-0}"
      echo "Grafana available replicas: ${GRAFANA_AVAILABLE:-0}"

      if [ "${APP_AVAILABLE:-0}" -lt 1 ]; then
        echo "ERROR: Application has no available replicas."
        exit 1
      fi

      if [ "${PROM_AVAILABLE:-0}" -lt 1 ]; then
        echo "ERROR: Prometheus has no available replicas."
        exit 1
      fi

      if [ "${GRAFANA_AVAILABLE:-0}" -lt 1 ]; then
        echo "ERROR: Grafana has no available replicas."
        exit 1
      fi

      echo
      echo "Application deployment: Available"
      echo "Prometheus deployment: Available"
      echo "Grafana deployment: Available"
      echo "Least-privilege runtime validation: PASSED"

      echo
      echo "=== GitOps Recovery Validation Complete ==="
    displayName: 'Validate Argo CD recovery and AKS workload'
