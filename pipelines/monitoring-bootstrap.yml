# Author: Chaithanya Nallamothu
# Role: Senior DevSecOps Engineer

trigger: none
pr: none

pool:
  name: Private-Azure-Agent-Pool
  demands:
    - Agent.Name -equals chay-secure-api-prod-agent-01

steps:
- checkout: self

- bash: |
    set -euo pipefail

    echo "=== Azure Managed Identity ==="
    az login --identity --output none
    az account set --subscription "c514ee69-6634-4342-8a48-9c00338e71aa"

    echo
    echo "=== Connect To Private AKS ==="
    az aks get-credentials \
      --resource-group chay-secure-api-prod-rg \
      --name chay-secure-api-prod-aks \
      --overwrite-existing

    kubelogin convert-kubeconfig -l azurecli

    echo
    echo "=== Update Restricted Argo CD Project ==="
    kubectl apply -f argocd/project.yaml

    echo
    echo "=== Register Monitoring Application ==="
    kubectl apply -f argocd/monitoring-application.yaml

    echo
    echo "=== Wait For Monitoring GitOps Reconciliation ==="
    for i in $(seq 1 30); do
      SYNC="$(kubectl get application chay-monitoring \
        -n argocd \
        -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"

      HEALTH="$(kubectl get application chay-monitoring \
        -n argocd \
        -o jsonpath='{.status.health.status}' 2>/dev/null || true)"

      echo "Attempt ${i}/30: Sync=${SYNC:-Pending} Health=${HEALTH:-Pending}"

      if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
        break
      fi

      sleep 10
    done

    echo
    echo "=== Argo CD Monitoring Application ==="
    kubectl get application chay-monitoring -n argocd

    echo
    echo "=== Prometheus Runtime ==="
    kubectl get deployment,pods,service -n monitoring -o wide

    echo
    echo "=== Prometheus Rollout ==="
    kubectl rollout status deployment/prometheus \
      -n monitoring \
      --timeout=180s

    echo
    echo "=== Prometheus Metrics Endpoint ==="
    kubectl port-forward \
      -n monitoring \
      service/prometheus 9090:9090 >/tmp/prometheus-port-forward.log 2>&1 &
    PF_PID=$!

    cleanup() {
      kill "$PF_PID" >/dev/null 2>&1 || true
      az logout >/dev/null 2>&1 || true
    }
    trap cleanup EXIT

    sleep 5

    curl --fail --silent \
      "http://127.0.0.1:9090/-/healthy"

    echo
    echo
    echo "=== Demo API Prometheus Target ==="
    curl --fail --silent \
      "http://127.0.0.1:9090/api/v1/targets" \
      | python3 -m json.tool \
      | grep -E '"health"|"scrapeUrl"|"lastError"' || true

    echo
    echo "=== Monitoring Bootstrap Complete ==="
  displayName: Bootstrap and validate Prometheus through GitOps
